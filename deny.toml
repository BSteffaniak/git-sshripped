[graph]
all-features = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

[advisories]
ignore = [
    # age currently depends on rsa for ssh-rsa recipient support; no upstream fix available yet.
    # Track: https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "deny"

# These duplicate versions are currently unavoidable due to transitive
# dependency trees brought in by `age` and its i18n stack. We keep this list
# explicit so new duplicate families fail CI by default.
skip = [
    # Direct crypto dependencies have moved to the next RustCrypto generation,
    # while `age` and its transitive dependencies still require these releases.
    { name = "aead", version = "0.5.2" },
    { name = "aes", version = "0.8.4" },
    { name = "base64", version = "0.21.7" },
    { name = "base64", version = "0.22.1" },
    { name = "block-buffer", version = "0.10.4" },
    { name = "chacha20", version = "0.9.1" },
    { name = "chacha20poly1305", version = "0.10.1" },
    { name = "cipher", version = "0.4.4" },
    { name = "cpufeatures", version = "0.2.17" },
    { name = "crypto-common", version = "0.1.7" },
    { name = "ctr", version = "0.9.2" },
    { name = "digest", version = "0.10.7" },
    { name = "getrandom", version = "0.2.17" },
    { name = "hkdf", version = "0.12.4" },
    { name = "hmac", version = "0.12.1" },
    { name = "hybrid-array", version = "0.2.3" },
    { name = "inout", version = "0.1.4" },
    { name = "poly1305", version = "0.8.0" },
    { name = "rand", version = "0.8.5" },
    { name = "rand_chacha", version = "0.3.1" },
    { name = "rand_core", version = "0.6.4" },
    { name = "rustc-hash", version = "1.1.0" },
    { name = "sha2", version = "0.10.9" },
    { name = "syn", version = "2.0.117" },
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror-impl", version = "1.0.69" },
    { name = "toml", version = "0.5.11" },
    { name = "universal-hash", version = "0.5.1" },
    { name = "windows-sys", version = "0.52.0" },
    { name = "windows-sys", version = "0.59.0" },
]
