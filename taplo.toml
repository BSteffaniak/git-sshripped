exclude = [".direnv/**", "target/**"]
include = [
    "*.toml",
    ".cargo/*.toml",
    ".clippier/**/*.toml",
    "fuzz/*.toml",
    "packages/*/*.toml",
    "packages/*/*/*.toml",
    "packages/*/*/.cargo/*.toml",
    "packages/*/.cargo/*.toml",
]

[formatting]
align_entries  = true
indent_string  = "    "
reorder_arrays = true
reorder_keys   = true
