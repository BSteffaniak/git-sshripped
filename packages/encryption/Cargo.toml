[package]
authors     = { workspace = true }
categories  = ["command-line-utilities", "development-tools"]
description = "Encryption domain for git-sshripped"
edition     = { workspace = true }
keywords    = ["crypt", "deterministic", "encryption", "git", "ssh"]
license     = { workspace = true }
name        = "git_sshripped_encryption"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
anyhow                          = { workspace = true, features = ["std"] }
git_sshripped_encryption_models = { workspace = true }
hkdf                            = { workspace = true }
profiling                       = { workspace = true }
sha2                            = { workspace = true }
thiserror                       = { workspace = true }

# Optional crypto backends
aes-siv = { workspace = true, optional = true, features = ["alloc"] }

[features]
crypto-aes-siv   = ["dep:aes-siv"]
default          = ["crypto-aes-siv"]
fail-on-warnings = ["git_sshripped_encryption_models/fail-on-warnings"]

[dev-dependencies]
proptest = { workspace = true }
